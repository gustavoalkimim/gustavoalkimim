name: Metrics — atualizar estatísticas

on:
  schedule:
    - cron: "0 6 * * *"   # todo dia às 06:00 UTC
  workflow_dispatch:       # botão manual na aba Actions

# evita dois workflows do perfil fazendo push ao mesmo tempo
concurrency:
  group: perfil-commits
  cancel-in-progress: false

jobs:
  metrics:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Estatísticas, linguagens e conquistas
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GH_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          committer_message: "chore: atualizar metrics [skip ci]"
          filename: profile/metrics.svg
          user: gustavoalkimim
          template: classic
          base: header, activity, community, repositories
          config_timezone: America/Sao_Paulo
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_limit: 8
          plugin_languages_indepth: no
          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_threshold: B

      - name: Calendário de contribuições
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GH_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          committer_message: "chore: atualizar calendário [skip ci]"
          filename: profile/metrics-calendario.svg
          user: gustavoalkimim
          base: ""
          config_timezone: America/Sao_Paulo
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
